# Non-default settings every node needs for schema.sql, new_sale.sql and
# purge.sql to work correctly. Use the same file on every node:
#
#     include 'ddb.conf'          # in postgresql.conf, then restart
#
# All settings below need a restart. Sizes cover the schema's limit of
# 32 nodes (N - 1 = 31 peers); each comment gives the rule. Up to 5 nodes,
# only wal_level and max_prepared_transactions differ from the defaults.
#
# Needed too, but not settable here:
#   * app.node_id is per node:  ALTER DATABASE bench SET app.node_id = <0..31>;
#   * subscriptions are created after init.sql has run on every node, with
#     WITH (copy_data = false, origin = none).

# Publications and subscriptions need logical decoding.
wal_level = logical                         # default: replica

# purge.sql commits the horizon update through PREPARE TRANSACTION, one at a
# time. Spare slots cover a psql that died mid-run. Such a leftover keeps the
# retention_horizon row locked, and every later purge fails on lock_timeout:
# find it in pg_prepared_xacts and ROLLBACK PREPARED it.
max_prepared_transactions = 4               # default: 0

# One slot and one walsender per peer subscribed to this node: >= N - 1.
max_replication_slots = 40                  # default: 10
max_wal_senders = 40                        # default: 10

# One apply worker per subscription on this node: >= N - 1. Parallel apply
# workers (streaming = parallel is the default since PG 18) share this pool;
# when it is exhausted they fall back to serial apply, which is still correct.
max_logical_replication_workers = 40        # default: 4

# One replication origin per subscription on this node: >= N - 1 (PG 18+).
max_active_replication_origins = 40         # default: 10

# Background workers: logical replication workers + launcher + parallel query.
max_worker_processes = 56                   # default: 8

# Keep at the defaults: a slot that is invalidated for a node that was cut off
# or idle for a long time cannot resume, and that node must be re-seeded.
#max_slot_wal_keep_size = -1
#idle_replication_slot_timeout = 0

# Optional: lets apply workers detect and log concurrent horizon updates from
# different nodes (conflict = update_origin_differs). Not needed for correctness.
#track_commit_timestamp = on
